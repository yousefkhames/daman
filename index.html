<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daman | ضمان</title>
<meta name="description" content="Daman keeps your receipts and warranty dates in your browser and warns you before a warranty ends. Arabic and English.">
<meta name="theme-color" content="#14232b">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="desk">
  <header class="top">
    <a class="brand" href="./" aria-label="Daman">
      <img src="assets/logo.svg" alt="" width="44" height="44">
      <span class="brand-text"><b data-i="appName">Daman</b><small data-i="tagline"></small></span>
    </a>
    <div class="top-actions">
      <button class="chip-btn" id="langBtn" type="button" aria-label="Language">العربية</button>
      <button class="icon-btn" id="settingsBtn" type="button" data-label="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <section class="stats" id="stats" aria-live="polite"></section>
    <section class="alert-box" id="alerts" hidden></section>

    <section class="toolbar" id="toolbar">
      <label class="search"><span class="sr" data-i="search"></span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" data-ph="search">
      </label>
      <div class="filters" id="filters" role="group" aria-label="Filter"></div>
      <label class="sort"><span data-i="s_by"></span>
        <select id="sort"></select>
      </label>
    </section>

    <section id="list" class="list" aria-live="polite"></section>
    <section id="empty" class="empty" hidden></section>
  </main>

  <button class="fab" id="addBtn" type="button"><span class="plus">+</span><span data-i="add"></span></button>
</div>

<dialog id="formDlg" class="sheet" aria-labelledby="formTitle">
  <form id="form" novalidate>
    <header class="sheet-head"><h2 id="formTitle"></h2><button type="button" class="icon-btn" data-close aria-label="Close">×</button></header>
    <div class="sheet-body">
      <input type="hidden" id="fId">
      <label class="fld"><span data-i="f_name"></span><input id="fName" maxlength="120" required autocomplete="off"><em class="err" id="eName"></em></label>
      <div class="row2">
        <label class="fld"><span data-i="f_store"></span> <i data-i="f_optional"></i><input id="fStore" maxlength="120" autocomplete="off"></label>
        <label class="fld"><span data-i="f_category"></span><select id="fCat"></select></label>
      </div>
      <div class="row2">
        <label class="fld"><span data-i="f_date"></span><input id="fDate" type="date" required><em class="err" id="eDate"></em></label>
        <label class="fld"><span data-i="f_price"></span> <i data-i="f_optional"></i><input id="fPrice" type="number" min="0" step="any" inputmode="decimal"><em class="err" id="ePrice"></em></label>
      </div>
      <div class="row2">
        <div class="fld"><span data-i="f_warranty"></span>
          <div class="combo"><input id="fWar" type="number" min="0" max="600" step="1" inputmode="numeric" value="12" aria-label="Warranty length"><select id="fUnit"><option value="m"></option><option value="y"></option></select></div>
          <em class="err" id="eWar"></em>
        </div>
        <label class="fld"><span data-i="f_alert"></span><input id="fAlert" type="number" min="0" max="365" step="1" inputmode="numeric" value="30"><em class="err" id="eAlert"></em></label>
      </div>
      <div class="preview" id="preview" aria-live="polite"></div>
      <label class="fld"><span data-i="f_serial"></span> <i data-i="f_optional"></i><input id="fSerial" maxlength="80" autocomplete="off" dir="ltr"></label>
      <label class="fld"><span data-i="f_notes"></span> <i data-i="f_optional"></i><textarea id="fNotes" rows="2" maxlength="1000"></textarea></label>
      <div class="fld"><span data-i="f_photo"></span>
        <div class="photo-pick">
          <div class="thumb-box" id="photoBox"></div>
          <div class="photo-btns">
            <label class="btn ghost" id="photoLabel"><span id="photoLabelText"></span><input id="fPhoto" type="file" accept="image/*" capture="environment" hidden></label>
            <button type="button" class="btn link" id="photoRemove" hidden></button>
          </div>
        </div>
      </div>
    </div>
    <footer class="sheet-foot"><button type="button" class="btn ghost" data-close data-i="cancel"></button><button type="submit" class="btn primary" data-i="save"></button></footer>
  </form>
</dialog>

<dialog id="detailDlg" class="sheet" aria-labelledby="dTitle">
  <div id="detail"></div>
</dialog>

<dialog id="settingsDlg" class="sheet" aria-labelledby="setTitle">
  <header class="sheet-head"><h2 id="setTitle" data-i="set_title"></h2><button type="button" class="icon-btn" data-close aria-label="Close">×</button></header>
  <div class="sheet-body">
    <div class="row2">
      <label class="fld"><span data-i="set_lang"></span><select id="sLang"><option value="en">English</option><option value="ar">العربية</option></select></label>
      <label class="fld"><span data-i="set_currency"></span><select id="sCur"></select></label>
    </div>
    <label class="fld"><span data-i="set_default_alert"></span><input id="sAlert" type="number" min="0" max="365" inputmode="numeric"></label>
    <div class="fld"><span data-i="set_notify"></span>
      <div class="notify"><button type="button" class="btn ghost" id="notifyBtn" data-i="set_notify_on"></button><small id="notifyState"></small></div>
    </div>
    <h3 data-i="set_data"></h3>
    <p class="hint" data-i="set_data_hint"></p>
    <div class="btn-grid">
      <button type="button" class="btn ghost" id="exportBtn" data-i="set_export"></button>
      <label class="btn ghost"><span data-i="set_import"></span><input id="importFile" type="file" accept="application/json,.json" hidden></label>
      <button type="button" class="btn ghost" id="csvBtn" data-i="set_csv"></button>
      <button type="button" class="btn ghost" id="sampleBtn" data-i="set_sample"></button>
      <button type="button" class="btn danger" id="clearBtn" data-i="set_clear"></button>
    </div>
    <p class="hint small" id="storageInfo"></p>
    <p class="hint small" data-i="set_about"></p>
  </div>
</dialog>

<dialog id="confirmDlg" class="sheet small">
  <div class="sheet-body"><p id="confirmText"></p></div>
  <footer class="sheet-foot"><button type="button" class="btn ghost" id="confirmNo" data-i="cancel"></button><button type="button" class="btn danger" id="confirmYes"></button></footer>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="print-sheet" id="printSheet" aria-hidden="true"></div>

<script src="core.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
